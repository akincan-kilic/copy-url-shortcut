<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Copy URL</title><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="check" viewBox="0 0 16 16"><path d="m3.2 8.4 3 2.9 6.6-6.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
<symbol id="markdown" viewBox="0 0 24 24"><path d="M3 17V7l5 5 5-5v10M19 7v10m-3-3 3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="arrow" viewBox="0 0 16 16"><path d="M4 12 12 4M5 4h7v7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="auto" viewBox="0 0 16 16"><path d="M2 3h12v8H2zM6 14h4M8 11v3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></symbol>
<symbol id="sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 1v1M8 14v1M1 8h1M14 8h1M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></symbol>
<symbol id="moon" viewBox="0 0 16 16"><path d="M13.5 9A5.8 5.8 0 0 1 7 2.5 5.8 5.8 0 1 0 13.5 9Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></symbol>
</svg>
<main class="panel">
<header class="p-head"><img src="icons/icon64.png" width="32" height="32" alt=""><div class="titles"><h1>Copy URL</h1><p>One shortcut. One link.</p></div><div class="appearance"><button id="theme-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Appearance: Auto"><svg aria-hidden="true"><use id="theme-icon" href="#auto"/></svg><span id="theme-label">Auto</span></button><div id="theme-menu" class="theme-menu" role="group" aria-label="Appearance" hidden><button type="button" data-theme="auto" aria-pressed="true"><svg aria-hidden="true"><use href="#auto"/></svg>Auto<span>✓</span></button><button type="button" data-theme="light" aria-pressed="false"><svg aria-hidden="true"><use href="#sun"/></svg>Light<span>✓</span></button><button type="button" data-theme="dark" aria-pressed="false"><svg aria-hidden="true"><use href="#moon"/></svg>Dark<span>✓</span></button></div></div></header>
<div class="actions"><button class="action" type="button" data-copy="url"><svg aria-hidden="true"><use href="#link"/></svg>Copy URL</button><button class="action secondary" type="button" data-copy="markdown"><svg aria-hidden="true"><use href="#markdown"/></svg>Copy Markdown</button></div>
<section aria-labelledby="confirmation-heading"><div class="section-head"><h2 id="confirmation-heading">Confirmation</h2><button class="text-button" id="preview" type="button">Preview</button></div><div class="styles" role="radiogroup" aria-label="Confirmation style"><button class="style-option selected" type="button" role="radio" aria-checked="true" data-style="text"><svg class="option-tick" aria-hidden="true"><use href="#check"/></svg><span class="pill"><svg aria-hidden="true"><use href="#check"/></svg>Link copied</span><span class="label">With text</span></button><button class="style-option" type="button" role="radio" aria-checked="false" data-style="check" tabindex="-1"><svg class="option-tick" aria-hidden="true"><use href="#check"/></svg><span class="pill check-only"><svg aria-hidden="true"><use href="#check"/></svg></span><span class="label">Checkmark</span></button></div></section>
<section class="shortcuts" aria-labelledby="shortcuts-heading"><div class="section-head"><h2 id="shortcuts-heading">Keyboard shortcuts</h2><button class="text-button" id="edit-shortcuts" type="button">Edit<svg aria-hidden="true"><use href="#arrow"/></svg></button></div><div class="shortcut-row"><span class="shortcut-name">Copy URL</span><span id="url-shortcut" class="unassigned">Not set</span></div><div class="shortcut-row"><span class="shortcut-name">Copy as Markdown<small>Page title + link · optional</small></span><span id="markdown-shortcut" class="unassigned">Not set</span></div></section>
<p id="status" class="status" role="status" aria-live="polite" hidden></p>
<footer class="p-footer"><span>On-device. No tracking.</span><a href="https://github.com/akincan-kilic/copy-url-shortcut/issues" target="_blank" rel="noopener noreferrer">Help</a></footer>
</main></body></html>
